name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable version tag to publish (for example, v1.10.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json version');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_PACKAGE=${name}\nRELEASE_VERSION=${version}\n`);
          JS
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:runtime
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false
      - run: node scripts/check-runtime-compat.mjs
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pack verified build
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
          echo "RELEASE_TARBALL=$RUNNER_TEMP/release/$RELEASE_PACKAGE-$RELEASE_VERSION.tgz" >> "$GITHUB_ENV"
      - name: Check npm publication
        id: npm
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const url = `https://registry.npmjs.org/${encodeURIComponent(process.env.RELEASE_PACKAGE)}/${process.env.RELEASE_VERSION}`;
          const response = await fetch(url);
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm version check failed: HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure the NPM_TOKEN repository secret with npm publishing access."
            exit 1
          fi
          pnpm publish "$RELEASE_TARBALL" --access public --no-git-checks --ignore-scripts --publish-wait-timeout 600000
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_TARBALL" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          echo "Released $RELEASE_PACKAGE@$RELEASE_VERSION from $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
